name: Verify public plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Plugin and release regression tests
        run: |
          python -m unittest discover -s plugins/etf-sentinel/tests -v
          python -m unittest discover -s tests -v
      - name: Verify the submitted inventory without rewriting it
        run: python tools/verify_package.py
      - name: Check reproducible release bytes
        run: |
          python tools/build_release.py --output-dir "$RUNNER_TEMP/release-a"
          python tools/build_release.py --output-dir "$RUNNER_TEMP/release-b"
          diff "$RUNNER_TEMP/release-a/SHA256SUMS" "$RUNNER_TEMP/release-b/SHA256SUMS"

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: plugins/etf-sentinel/runtime
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/../etf-runtime-venv
      UV_CACHE_DIR: ${{ github.workspace }}/../uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/../uv-python
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Install pinned runtime and test dependencies
        run: uv sync --frozen --all-extras --no-editable --python 3.12
      - name: Report numerical thread limits
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          import numpy
          import sklearn
          from threadpoolctl import threadpool_info

          safe_fields = ("user_api", "internal_api", "num_threads", "prefix", "version")
          print(json.dumps({
              "cpu_count": os.cpu_count(),
              "threadpools": [
                  {key: pool.get(key) for key in safe_fields}
                  for pool in threadpool_info()
              ],
          }, sort_keys=True))
          PY
      - name: Diagnose isolated Demo CLI regression
        run: >-
          uv run --no-sync pytest
          tests/e2e/test_demo_workflow.py::test_demo_cli_runs_without_any_provider_api_key
          -x --tb=short --durations=5
      - name: Runtime regression tests
        run: uv run --no-sync pytest -x --tb=short --durations=10
      - name: Browser monitoring contract tests
        run: node --test tests/ui/test_monitor.cjs
